# Builds the Windows installer and publishes it as a GitHub Release.
# Trigger: push a tag like v9.5.0 (must match "version" in package.json),
# or run it from the Actions tab (it tags the current package.json version itself).
# Installed copies of Hunt Radar pick the new release up automatically.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - name: Build installer
        run: npm run dist
      - name: Publish release (installer + latest.yml for auto-update)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          files=(dist/*.exe dist/*.blockmap dist/latest.yml)
          ls -la "${files[@]}"
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" "${files[@]}" --clobber
          else
            gh release create "$v" "${files[@]}" --title "Hunt Radar $v" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release view "$v" --json assets -q '.assets[].name'
